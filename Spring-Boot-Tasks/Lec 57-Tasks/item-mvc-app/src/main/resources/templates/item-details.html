<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Item Details</title>
</head>
<body>
    <h1>Item Details</h1>
    <p><strong>ID:</strong> <span th:text="${item.id}"></span></p>
    <p><strong>Name:</strong> <span th:text="${item.name}"></span></p>
    <p><strong>Description:</strong> <span th:text="${item.description}"></span></p>
    <p><strong>Price:</strong> <span th:text="${item.price}"></span></p>
    <p><strong>Quantity:</strong> <span th:text="${item.quantity}"></span></p>
    <a th:href="@{/items/{id}/edit(id=${item.id})}">Edit</a> |
    <a th:href="@{/items}">Back to list</a>
</body>
</html>
