<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${item.id} != null ? 'Edit Item' : 'Add Item'"></title>
</head>
<body>
    <h1 th:text="${item.id} != null ? 'Edit Item' : 'Add Item'"></h1>

    <form th:action="${item.id} != null ? @{/items/{id}(id=${item.id})} : @{/items}"
          th:object="${item}" method="post">
        <div>
            <label>Name: <input type="text" th:field="*{name}"/></label>
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red"></span>
        </div>
        <div>
            <label>Description: <input type="text" th:field="*{description}"/></label>
        </div>
        <div>
            <label>Price: <input type="number" step="0.01" th:field="*{price}"/></label>
        </div>
        <div>
            <label>Quantity: <input type="number" th:field="*{quantity}"/></label>
        </div>
        <button type="submit">Save</button>
    </form>
    <a th:href="@{/items}">Back to list</a>
</body>
</html>
