<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Items</title>
</head>
<body>
    <h1>All Items</h1>
    <a th:href="@{/items/new}">Add New Item</a>
    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Description</th><th>Price</th><th>Quantity</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.description}"></td>
                <td th:text="${item.price}"></td>
                <td th:text="${item.quantity}"></td>
                <td>
                    <a th:href="@{/items/{id}(id=${item.id})}">View</a> |
                    <a th:href="@{/items/{id}/edit(id=${item.id})}">Edit</a> |
                    <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post" style="display:inline">
                        <button type="submit" onclick="return confirm('Delete this item?');">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
