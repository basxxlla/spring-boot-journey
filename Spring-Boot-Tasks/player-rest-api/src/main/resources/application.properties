# H2 in-memory DB - zero setup, resets on every restart.
# To use MySQL instead, replace these 4 lines with your MySQL connection
# details and change the driver-class-name / dialect accordingly.
spring.datasource.url=jdbc:h2:mem:playerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:playerdb)
spring.h2.console.enabled=true

server.port=8080
